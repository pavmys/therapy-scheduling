# Міграції в базу staging (ADR 0007): окремий проєкт Supabase для гілки staging, яку PM перевіряє на Vercel.
# Лише CI застосовує міграції — як db-deploy у ci.yml для проду, але через environment staging
# (Settings → Environments → staging, Deployment branches = staging, секрет SUPABASE_DB_URL — Session pooler, порт 5432).
name: db-deploy-staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      include_seed:
        description: "Застосувати й supabase/seed.sql (--include-seed) — перший запуск"
        type: boolean
        default: false

jobs:
  db-deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SEED_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.include_seed && '--include-seed' || '' }}
    steps:
      - name: Check Supabase secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error title=db-deploy-staging::Секрет SUPABASE_DB_URL в environment staging не задано."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      # Без --include-all: міграція, старша за вже застосовану, має впасти, а не застосуватись не в тому порядку.
      - name: Dry run (list of migrations to apply)
        run: supabase db push --yes --dry-run --db-url "$SUPABASE_DB_URL" $SEED_FLAG
      - name: Apply migrations
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL" $SEED_FLAG
